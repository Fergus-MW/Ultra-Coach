[project]
name = "ultracoach-server"
version = "0.1.0"
description = "Proactive voice coaching backend for ultra-coach"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "zep-cloud>=2.0.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependencies are declared as argument defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
